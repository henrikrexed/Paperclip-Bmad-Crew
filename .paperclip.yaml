# Paperclip portable company package — BMAD Crew (schema: paperclip/v1)
#
# One-command setup (provisions all 10 agents WITH skills + reporting hierarchy):
#   npx paperclipai company import ./ --target existing --company-id <your-company-id> --include agents
#
# Per-agent skills and reporting links live in each agents/<slug>/AGENTS.md frontmatter
# (skills:, reportsTo:). This file (.paperclip.yaml) carries the non-prose extension
# fields (role, icon, adapter, runtime, budget, metadata) keyed by agent slug, plus the
# sidebar ordering. COMPANY.md at the package root is required by the importer.
#
# After import, attach the crew under your existing CEO:
#   npx paperclipai agent update cto --reports-to <your-ceo-agent-id>

schema: "paperclip/v1"
agents:
  cto:
    role: "cto"
    icon: "shield"
    capabilities: null
    adapter:
      type: "claude_local"
      config: {}
    runtime:
      heartbeat:
        enabled: true
        intervalSec: 0
        wakeOnOnDemand: true
        wakeOnAssignment: true
    permissions: {}
    budgetMonthlyCents: 1500000
    metadata:
      planningArtifacts: "docs/planning"
      implementationArtifacts: "docs/implementation"
