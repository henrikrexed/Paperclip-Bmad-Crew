# Paperclip portable company package — BMAD Crew
#
# One-command setup:
#   npx paperclipai company import ./ --target existing --company-id <your-company-id> --include agents
#
# This provisions all 10 agents (a crew manager + the 9 BMAD agents) with:
#   - their persona / capabilities / collaboration rules (from agents/<slug>/AGENTS.md)
#   - their BMAD skill assignments (the `skills:` list per agent)
#   - the reporting hierarchy (`reportsToSlug:` wires each agent to the crew manager)
#   - artifact-directory conventions (agent `metadata`)
#
# No manual Steps 2-4 required. To attach the crew under your existing CEO, point
# the `cto` agent at your CEO after import:
#   npx paperclipai agent update cto --reports-to <your-ceo-agent-id>
#
